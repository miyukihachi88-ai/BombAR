<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<!-- 距離UI -->
<div id="distanceUI" style="
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.6);
color:white;
padding:10px;
border-radius:10px;
z-index:10;">
距離取得中...
</div>

<!-- 発見UI -->
<div id="foundUI" style="
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
background:rgba(255,0,0,0.9);
color:white;
padding:20px 40px;
border-radius:20px;
font-size:40px;
font-weight:bold;
display:none;
z-index:100;
text-align:center;
box-shadow:0 0 20px rgba(255,0,0,0.8);
">
発見！
</div>

<!-- ミニマップ -->
<img id="mapImg" src="map.png" style="
position:absolute;
top:20px;
left:20px;
width:200px;
height:306px;
z-index:5;
transform-origin: center;
">

<canvas id="mapCanvas" width="150" height="230" style="
position:absolute;
top:20px;
left:20px;
z-index:10;
transform-origin: center;
"></canvas>

<button id="toggleMap" style="
position:absolute;
top:340px;
left:20px;
z-index:20;">
マップOFF
</button>

<a-scene
vr-mode-ui="enabled:false"
embedded
arjs="sourceType:webcam; facingMode:environment;"
>
<a-assets>
  <a-asset-item id="bombModel" src="Bomb.glb"></a-asset-item>
</a-assets>

<a-camera gps-camera rotation-reader
  raycaster="objects: .clickable"
  cursor="fuse: false; rayOrigin: mouse">
</a-camera>
</a-scene>

<script>

// ===== 爆弾データ =====
const bombs = [
  { lat: 35.7272323, lng: 139.5414221, found: false },
  { lat: 35.736937, lng: 139.537907, found: false },
  { lat: 35.737052, lng: 139.537947, found: false },
  { lat: 35.737248, lng: 139.537907, found: false },
  { lat: 35.737478, lng: 139.53808, found: false },
  { lat: 35.737703, lng: 139.5381, found: false },
  { lat: 35.737934, lng: 139.538061, found: false },
  { lat: 35.738154, lng: 139.538183, found: false },
  { lat: 35.738561, lng: 139.538271, found: false },
  { lat: 35.738789, lng: 139.538292, found: false },
  { lat: 35.739154, lng: 139.538353, found: false },
  { lat: 35.739586, lng: 139.538666, found: false },
  { lat: 35.739867, lng: 139.538581, found: false },
  { lat: 35.740057, lng: 139.538597, found: false },
  { lat: 35.740265, lng: 139.538585, found: false },
  { lat: 35.74047, lng: 139.538701, found: false },
  { lat: 35.740801, lng: 139.538547, found: false }
];

let bombEntities = [];
let showMap = false;
let mapScale = 1;
let zoom = 1;

let smoothedLat = null;
let smoothedLng = null;

function smooth(current, last) {
  if (last === null) return current;
  return last + (current - last) * 0.1;
}

// ===== ミニマップ範囲 =====
const mapMinLat = 35.73947;
const mapMaxLat = 35.74008;
const mapMinLng = 139.53774;
const mapMaxLng = 139.53871;

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

// ===== マップON/OFF =====
document.getElementById("toggleMap").onclick = () => {
  showMap = !showMap;

  document.getElementById("mapCanvas").style.display = showMap ? "block" : "none";
  document.getElementById("mapImg").style.display = showMap ? "block" : "none";

  document.getElementById("toggleMap").innerText =
    showMap ? "マップON" : "マップOFF";
};

// ===== 座標変換 =====
function convert(lat, lng, userLat, userLng) {

  // 表示範囲をズームで変える
  const latRange = (mapMaxLat - mapMinLat) / zoom;
  const lngRange = (mapMaxLng - mapMinLng) / zoom;

  const minLat = userLat - latRange / 2;
  const maxLat = userLat + latRange / 2;
  const minLng = userLng - lngRange / 2;
  const maxLng = userLng + lngRange / 2;

  const x = (lng - minLng) / (maxLng - minLng) * canvas.width;
  const y = (maxLat - lat) / (maxLat - minLat) * canvas.height;

  return { x, y };
}

// ===== ミニマップ描画 =====
function drawMap(userLat, userLng) {

  if (!showMap) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 自分は中央固定じゃなくてもOK（自然になる）
  const me = convert(userLat, userLng, userLat, userLng);

  ctx.fillStyle = "blue";
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, 6, 0, Math.PI * 2);
  ctx.fill();
}

let initialDistance = null;

canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    initialDistance = getDistanceTouch(e);
  }
});

canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {

    const newDistance = getDistanceTouch(e);

    if (initialDistance) {
      const scaleChange = newDistance / initialDistance;

      zoom *= scaleChange;

      // 制限
      zoom = Math.max(0.5, Math.min(zoom, 10));

      initialDistance = newDistance;
    }
  }
});

function getDistanceTouch(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
// ===== 初期化 =====
window.onload = () => {

  const scene = document.querySelector("a-scene");

  bombs.forEach((b, i) => {

    const el = document.createElement("a-entity");

    el.setAttribute("gps-entity-place", `latitude:${b.lat}; longitude:${b.lng}`);
    el.setAttribute("gltf-model", "#bombModel");
    el.setAttribute("scale", "4 4 4");
    el.setAttribute("visible", "false");

    // 当たり判定
    const hitbox = document.createElement("a-sphere");

    hitbox.setAttribute("radius", "3");
    hitbox.setAttribute("position", "0 0 0");
    hitbox.setAttribute("material", "opacity:0.01; transparent:true");

    // クリック対象
    hitbox.classList.add("clickable");

    hitbox.addEventListener("click", () => {
      if (!bombs[i].found) {

        bombs[i].found = true;

        el.setAttribute("scale", "5 5 5");
        el.removeAttribute("animation");

        el.ring.setAttribute("visible", "false");

        const ui = document.getElementById("foundUI");

        const remaining = getRemainingCount();

        if (remaining === 0) {
          ui.innerText = "🎉 クリア！！";
        } else {
          ui.innerText = `発見！ あと ${remaining} 個`;
        }

        ui.style.display = "block";

        setTimeout(() => {
          ui.style.display = "none";
        }, 1500);
      }
    });

    el.appendChild(hitbox);

    scene.appendChild(el);
    bombEntities.push(el);
  });

  startGPS();
};

// ===== GPS =====
function startGPS() {
  navigator.geolocation.watchPosition((pos) => {

    const rawLat = pos.coords.latitude;
    const rawLng = pos.coords.longitude;

    smoothedLat = smooth(rawLat, smoothedLat);
    smoothedLng = smooth(rawLng, smoothedLng);

    const userLat = smoothedLat;
    const userLng = smoothedLng;
    let nearestDist = Infinity;

    bombs.forEach((b, i) => {

      const dist = getDistance(userLat, userLng, b.lat, b.lng);
      const el = bombEntities[i];

      if (!bombs[i].found && dist < nearestDist) {
        nearestDist = dist;
      }

      if (dist < 20) {

        el.setAttribute("visible", true);
        // ⭐ リング追加
        const ring = document.createElement("a-ring");
        el.ring = ring;

        ring.setAttribute("radius-inner", "2");
        ring.setAttribute("radius-outer", "3");
        ring.setAttribute("rotation", "-90 0 0");
        ring.setAttribute("position", "0 0 0");

        // 光る設定
        ring.setAttribute("material", "color: yellow; emissive: yellow; emissiveIntensity: 2");

        el.appendChild(ring);

        if (!bombs[i].found) {
          el.setAttribute("animation", {
            property: "scale",
            dir: "alternate",
            dur: 500,
            loop: true,
            to: "4 4 4"
          });
        }

      } else {
        el.setAttribute("visible", false);
      }
    });

    // 距離UI
    document.getElementById("distanceUI").innerText =
      (nearestDist === Infinity)
        ? "クリア！"
        : "あと " + Math.floor(nearestDist) + " m";

    // ミニマップ更新
    drawMap(userLat, userLng);

  });
}

function getRemainingCount() {
  let count = 0;

  bombs.forEach(b => {
    if (!b.found) count++;
  });

  return count;
}

// ===== 距離計算 =====
function getDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

</script>
</body>
</html>
