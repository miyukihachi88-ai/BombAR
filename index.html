<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<div id="distanceUI" style="
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.6);
color:white;
padding:10px;
border-radius:10px;
z-index:10;">
距離取得中...
</div>

<div id="foundUI" style="
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
background:rgba(255,0,0,0.9);
color:white;
padding:20px 40px;
border-radius:20px;
font-size:40px;
font-weight:bold;
display:none;
z-index:100;
text-align:center;
box-shadow:0 0 20px rgba(255,0,0,0.8);
">
発見！
</div>

<img id="mapImg" src="map.png" style="
position:absolute;
top:20px;
left:20px;
width:200px;
height:306px;
z-index:5;
">

<canvas id="mapCanvas" width="150" height="230" style="
position:absolute;
top:20px;
left:20px;
z-index:10;
"></canvas>

<button id="toggleMap" style="
position:absolute;
top:340px;
left:20px;
z-index:20;">
マップOFF
</button>

<a-scene vr-mode-ui="enabled:false" embedded arjs="sourceType:webcam; facingMode:environment;">
<a-assets>
  <a-asset-item id="bombModel" src="Bomb.glb"></a-asset-item>
</a-assets>
<a-camera gps-camera rotation-reader></a-camera>
</a-scene>

<script>

// ===== データ =====
const bombs = [
  { lat: 35.7272323, lng: 139.5414221, found: false },
  { lat: 35.736937, lng: 139.537907, found: false }
];

let bombEntities = [];
let showMap = false;
let zoom = 1;

let smoothedLat = null;
let smoothedLng = null;

function smooth(c, l){ return l===null?c:l+(c-l)*0.1; }

// ===== UI =====
document.getElementById("toggleMap").onclick = () => {
  showMap = !showMap;
  mapCanvas.style.display = showMap ? "block" : "none";
  mapImg.style.display = showMap ? "block" : "none";
};

// ===== 初期化 =====
window.onload = () => {

  const scene = document.querySelector("a-scene");

  bombs.forEach((b,i)=>{
    const el = document.createElement("a-entity");

    el.setAttribute("gps-entity-place", `latitude:${b.lat}; longitude:${b.lng}`);
    el.setAttribute("gltf-model", "#bombModel");
    el.setAttribute("scale", "8 8 8");
    el.setAttribute("visible", "false");

    // リング
    const ring = document.createElement("a-ring");
    ring.setAttribute("radius-inner","2");
    ring.setAttribute("radius-outer","3");
    ring.setAttribute("rotation","-90 0 0");
    ring.setAttribute("material","color:yellow; emissive:yellow; emissiveIntensity:2");

    el.appendChild(ring);
    el.ring = ring;

    scene.appendChild(el);
    bombEntities.push(el);
  });

  // ⭐ タップ＝最寄り爆弾発見
  document.addEventListener("click", ()=>{
    let nearestDist = Infinity;
    let nearestIndex = -1;

    bombs.forEach((b,i)=>{
      if(b.found) return;
      const d = getDistance(smoothedLat, smoothedLng, b.lat, b.lng);
      if(d<nearestDist){
        nearestDist = d;
        nearestIndex = i;
      }
    });

    if(nearestDist<30 && nearestIndex!==-1){
      handleFound(nearestIndex);
    }
  });

  startGPS();
};

// ===== 発見処理 =====
function handleFound(i){
  if(bombs[i].found) return;

  bombs[i].found = true;
  const el = bombEntities[i];

  el.setAttribute("scale","5 5 5");
  el.removeAttribute("animation");

  if(el.ring) el.ring.setAttribute("visible","false");

  const ui = document.getElementById("foundUI");
  const remaining = bombs.filter(b=>!b.found).length;

  ui.innerText = remaining===0 ? "🎉クリア！！" : `発見！あと ${remaining} 個`;
  ui.style.display="block";

  setTimeout(()=>ui.style.display="none",1500);
}

// ===== GPS =====
function startGPS(){
  navigator.geolocation.watchPosition((pos)=>{

    smoothedLat = smooth(pos.coords.latitude, smoothedLat);
    smoothedLng = smooth(pos.coords.longitude, smoothedLng);

    let nearestDist = Infinity;

    bombs.forEach((b,i)=>{

      const dist = getDistance(smoothedLat, smoothedLng, b.lat, b.lng);
      const el = bombEntities[i];

      if(!b.found && dist<nearestDist){
        nearestDist = dist;
      }

      if(dist<20){
        el.setAttribute("visible",true);
        if(el.ring) el.ring.setAttribute("visible",true);

        if(!b.found){
          el.setAttribute("animation",{
            property:"scale",
            dir:"alternate",
            dur:500,
            loop:true,
            to:"4 4 4"
          });
        }

      } else {
        el.setAttribute("visible",false);
        if(el.ring) el.ring.setAttribute("visible",false);
      }

    }); // ← ★これがエラー原因だったやつ

    distanceUI.innerText =
      nearestDist===Infinity ? "クリア！" : "あと "+Math.floor(nearestDist)+" m";

  });
}

// ===== 距離 =====
function getDistance(lat1, lon1, lat2, lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

</script>
</body>
</html>
