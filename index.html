<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body>

<div id="distanceUI">距離取得中...</div>
<div id="foundUI">発見！</div>

<img id="mapImg" src="map.png">

<canvas id="mapCanvas"
        width="600"
        height="918">
</canvas>

<button id="toggleMap">
    MAP ON
</button>

<a-scene
    vr-mode-ui="enabled:false"
    embedded
    arjs="sourceType:webcam; facingMode:environment;">

    <a-assets>
        <a-asset-item
            id="bombModel"
            src="Bomb.glb">
        </a-asset-item>
    </a-assets>
    <a-box
    id="testBox"
    position="0 0 -5"
    width="2"
    height="2"
    depth="2"
    color="red">
</a-box>

<a-camera
    gps-camera
    rotation-reader>
</a-camera>
    <a-camera
        gps-new-camera="gpsMinDistance: 2; gpsTimeInterval: 1000;"
        rotation-reader>
    </a-camera>

</a-scene>

<script src="script.js"></script>

</body>

</html>
